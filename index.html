<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteOS | v1.0</title>
    <style>
        :root { --bg: #0a0a0a; --taskbar: #151515; --accent: #00ff88; }
        body { margin: 0; background: var(--bg); font-family: 'Consolas', monospace; color: white; overflow: hidden; }
        
        #desktop { width: 100vw; height: calc(100vh - 45px); position: relative; }
        
        /* The Virtual Window */
        .window { width: 900px; height: 600px; position: absolute; top: 50px; left: 50px; 
                  background: #fff; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; 
                  box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid #333; }
        
        .title-bar { height: 35px; background: var(--taskbar); display: flex; align-items: center; 
                     padding: 0 15px; cursor: move; justify-content: space-between; }
        
        .window-content { flex-grow: 1; border: none; }

        #taskbar { height: 45px; background: var(--taskbar); display: flex; align-items: center; 
                   padding: 0 20px; border-top: 1px solid #222; position: absolute; bottom: 0; width: 100%; }
        
        .start-btn { color: var(--accent); font-weight: bold; cursor: pointer; border: 1px solid var(--accent); 
                     padding: 5px 15px; border-radius: 4px; }
    </style>
</head>
<body>

<div id="desktop">
    <div class="window" id="browser-window">
        <div class="title-bar">
            <span>ByteBrowser - The Vault</span>
            <span style="color: #ff5f56;">●</span>
        </div>
        <iframe class="window-content" src="https://www.wikipedia.org"></iframe>
    </div>
</div>

<div id="taskbar">
    <div class="start-btn">BYTE</div>
</div>

<script>
    // Register the ByteOS Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
            console.log('ByteOS Kernel: Online');
        }).catch(err => console.log('Kernel Error:', err));
    }

    // Quick Draggable Logic (Simplest version)
    const win = document.querySelector('.window');
    const bar = document.querySelector('.title-bar');
    let isDragging = false;

    bar.onmousedown = () => isDragging = true;
    window.onmouseup = () => isDragging = false;
    window.onmousemove = (e) => {
        if (isDragging) {
            win.style.left = e.clientX - 450 + 'px';
            win.style.top = e.clientY - 15 + 'px';
        }
    };
</script>
</body>
</html>
